<header class="app-header px-3">
  <div class="app-header__inner">
    <a [routerLink]="['/inicio']" class="app-home-btn" aria-label="Ir al inicio">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5" />
        <path d="M5 9.5V21h14V9.5" />
      </svg>
      <span>Inicio</span>
    </a>

    <a [routerLink]="['/inicio']" class="brand text-decoration-none">
      <span class="brand-title">CasaAgenda</span>
    </a>

    <button class="app-logout-btn" type="button" (click)="logout()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4" />
        <path d="M4 12h11" />
        <path d="M11 8l4 4-4 4" />
      </svg>
      <span>Salir</span>
    </button>
  </div>
</header>

<div class="app-shell">
  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
</div>
