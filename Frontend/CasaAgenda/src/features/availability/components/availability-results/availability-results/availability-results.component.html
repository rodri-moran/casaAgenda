<div class="d-flex justify-content-center mt-3">
  <div class="card p-3">
    @if (apartments?.length) {
      <div class="row g-3 justify-content-center">
        @for (apt of apartments; track $index) {
          <div
            class="d-flex"
            [class.col-12]="apartments?.length === 1"
            [class.col-md-6]="apartments?.length !== 1"
          >
            <app-apartment-card class="w-100" [apartment]="apt"></app-apartment-card>
          </div>
        }
      </div>
    } @else {
      <div class="py-5 text-center text-muted-custom">No hay disponibilidad para esa fecha.</div>
    }
  </div>
</div>
