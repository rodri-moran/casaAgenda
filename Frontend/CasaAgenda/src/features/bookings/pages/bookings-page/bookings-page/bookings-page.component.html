<div class="d-flex align-items-center justify-content-between mb-3">
  <div>
    <h2 class="mb-0 fw-bold">Reservas</h2>
    <div class="text-muted-custom d-none d-md-block">
      Seleccioná un departamento para ver su calendario.
    </div>
  </div>

  <button
    class="btn btn-outline-light booking-btn"
    data-bs-toggle="modal"
    data-bs-target="#bookingFormModal"
  >
    + Nueva reserva
  </button>
</div>

<div class="row g-3">
  <div class="col-12 col-md-2">
    <div class="card p-2">
      <div class="fw-semibold px-2 py-2">Departamentos</div>

      <div class="list-group list-group-flush">
        @for (d of apartments; track d.id) {
          <button
            type="button"
            class="list-group-item list-group-item-action btn-select text-white"
            (click)="selectedApartmentId = d.id"
            [class.active]="selectedApartmentId === d.id"
          >
            {{ d.name }}
          </button>
        }
      </div>
    </div>
  </div>

  <div class="col-12 col-xl-6">
    <div class="card p-3">
      <ng-container *ngIf="selectedApartmentId; else emptyState">
        <app-booking-calendar
          [bookings]="filteredBookings"
          (selectedBooking)="selectedBookingId.set($event)"
        ></app-booking-calendar>
      </ng-container>

      <ng-template #emptyState>
        <div class="py-5 text-center text-muted-custom">
          Elegí un departamento para ver sus reservas.
        </div>
      </ng-template>
    </div>
  </div>
  <div class="col-12 col-xl-4">
    <!-- Panel detalle -->
    @if (selectedBooking(); as b) {
      <app-booking-detail-panel
        [booking]="b"
        [apartment]="selectedApartment()"
        (edit)="openEditModal($event)"
        (cancel)="openCancelDialog($event)"
        (close)="selectedBookingId.set(null)"
      />
    } @else {
      <div class="card p-3 text-muted-custom">
        Tocá una reserva del calendario para ver el detalle.
      </div>
    }
  </div>
</div>
<app-booking-form-modal [apartments]="apartments"></app-booking-form-modal>

<app-booking-edit-modal [booking]="editingBooking"></app-booking-edit-modal>
