spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  h2:
    console:
      enabled: false
server:
  port: ${PORT:8080}
app:
  allowed-origin: ${ALLOWED_ORIGIN}
  security:
    username: ${APP_USERNAME}
    password: ${APP_PASSWORD}
