<div class="d-flex justify-content-center mt-3">
  <div class="card p-3">
    @if (apartments.length != 0) {
      <div class="row g-3 justify-content-start">
        @for (apt of apartments; track $index) {
          <div class="col-12 col-xl-6 col-xxl-4">
            <app-apartment-card [apartment]="apt"></app-apartment-card>
          </div>
        }
      </div>
    }
    <!-- Poner if check in y check out touched y apartments.length == 0 -->
    @else {
      <div class="py-5 text-center text-muted-custom">No hay disponibilidad para esa fecha.</div>
    }
  </div>
</div>
