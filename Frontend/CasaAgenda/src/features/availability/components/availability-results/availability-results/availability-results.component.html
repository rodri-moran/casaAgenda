@if (apartments; as lista) {
  @if (lista.length) {
    <div class="result-banner">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 13l4 4L19 7" />
      </svg>
      <span>
        @if (lista.length === 1) {
          Hay 1 departamento libre
        } @else {
          Hay {{ lista.length }} departamentos libres
        }
      </span>
    </div>

    <div class="row g-3">
      @for (apt of lista; track apt.id) {
        <div class="col-12 col-lg-6">
          <app-apartment-card
            [apartment]="apt"
            (open)="goToBookings($event)"
          ></app-apartment-card>
        </div>
      }
    </div>
  } @else {
    <div class="result-empty">
      <p class="result-empty__title">No hay ningún departamento libre en esas fechas</p>
      <p class="result-empty__sub">Probá con otros días.</p>
    </div>
  }
}
