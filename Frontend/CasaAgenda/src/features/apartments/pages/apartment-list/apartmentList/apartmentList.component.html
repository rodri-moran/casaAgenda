<div class="apartments-head">
  <h1 class="page-title">Departamentos</h1>

  <a class="add-btn" [routerLink]="['/crearDepartamento']">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 5v14M5 12h14" />
    </svg>
    Agregar
  </a>
</div>

@if (apartments(); as apartments) {
  @if (apartments.length === 0) {
    <div class="empty-state">
      <p class="empty-state__title">Todavía no cargaste ningún departamento</p>
      <p class="empty-state__sub">Tocá "Agregar" para cargar el primero.</p>
    </div>
  } @else {
    <div class="apartments-grid">
      @for (apt of apartments; track apt.id) {
        <app-apartment-card
          [apartment]="apt"
          (open)="goToBookings($event)"
          (edit)="openEdit($any($event))"
        ></app-apartment-card>
      }
    </div>
  }
}

<app-apartment-edit-modal [apartment]="editing()" (updated)="onUpdated($event)"></app-apartment-edit-modal>
