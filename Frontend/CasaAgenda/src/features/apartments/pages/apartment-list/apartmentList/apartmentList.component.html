

<div class="d-flex justify-content-end mb-4">
  <button
    class="btn btn-outline-light align-items-end booking-btn"
    [routerLink]="['/crearDepartamento']"
  >
    Nuevo departamento
  </button>
</div>
<div class="row g-3 justify-content-center">
  @for (apt of (apartments$ | async); track apt.id) {
  <div class="col-md-6">    
    <app-apartment-card [apartment]="apt" (open)="goToBookings($event)"></app-apartment-card>
  </div>
  }
</div>
