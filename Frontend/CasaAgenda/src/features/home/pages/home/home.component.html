<div class="home">
  <header class="home__head">
    <h1 class="home__greeting">¿Qué querés hacer?</h1>
    <p class="home__date">{{ fechaDeHoy }}</p>
  </header>

  <nav class="home__tiles">
    <a class="home-tile" [routerLink]="['/reservas']">
      <span class="home-tile__icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="2" />
          <path d="M8 3v4M16 3v4M3 11h18" />
        </svg>
      </span>
      <span class="home-tile__text">
        <span class="home-tile__title">Ver las reservas</span>
        <span class="home-tile__sub">Calendario de cada departamento</span>
      </span>
      <span class="home-tile__chev" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6" />
        </svg>
      </span>
    </a>

    <a class="home-tile" [routerLink]="['/disponibilidad']">
      <span class="home-tile__icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-3.6-3.6" />
        </svg>
      </span>
      <span class="home-tile__text">
        <span class="home-tile__title">¿Hay lugar?</span>
        <span class="home-tile__sub">Buscar por fechas</span>
      </span>
      <span class="home-tile__chev" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6" />
        </svg>
      </span>
    </a>

    <a class="home-tile" [routerLink]="['/departamentos']">
      <span class="home-tile__icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="18" rx="2" />
          <path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2" />
        </svg>
      </span>
      <span class="home-tile__text">
        <span class="home-tile__title">Departamentos</span>
        <span class="home-tile__sub">Ver los que tenés o agregar uno</span>
      </span>
      <span class="home-tile__chev" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6" />
        </svg>
      </span>
    </a>

    <a class="home-tile" [routerLink]="['/calculadora']">
      <span class="home-tile__icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="18" rx="2" />
          <path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01" />
        </svg>
      </span>
      <span class="home-tile__text">
        <span class="home-tile__title">Sacar cuentas</span>
        <span class="home-tile__sub">Calculadora de precios</span>
      </span>
      <span class="home-tile__chev" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6" />
        </svg>
      </span>
    </a>
  </nav>
</div>
