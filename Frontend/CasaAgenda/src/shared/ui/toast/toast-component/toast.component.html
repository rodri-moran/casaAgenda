<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div
    class="toast align-items-center border-0 show mb-2"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
    *ngFor="let toast of toasts$ | async"
    [ngClass]="toastClass(toast)"
  >
    <div class="d-flex">
      <div class="toast-body">
        <span class="me-2">{{ icon(toast) }}</span>
        <strong *ngIf="toast.title">{{ toast.title }}:</strong>
        <span class="ms-1">{{ toast.message }}</span>
      </div>

      <button
        type="button"
        class="btn-close btn-close-white me-2 m-auto"
        aria-label="Close"
        (click)="close(toast)"
      ></button>
    </div>
  </div>
</div>
